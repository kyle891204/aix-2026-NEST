spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: team03-backend

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:${SERVER_PORT:8081}}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: NEST_SESSION
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: lax
        path: /api
  error:
    include-message: never
    include-stacktrace: never

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  lms:
    api-base-url: ${LMS_API_BASE_URL:https://learning.hanyang.ac.kr/api/v1}
    api-token: ${LMS_API_TOKEN:}
    demo-password: ${LMS_DEMO_PASSWORD:}
